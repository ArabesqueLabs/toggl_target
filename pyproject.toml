[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toggl-target"
version = "2.0.0"
description = "Modern Toggl time tracking target calculator"
authors = [{name = "Mosab Ibrahim", email = "mosab.a.ibrahim@gmail.com"}]
license = {text = "GPL-2.0"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]
async = [
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
]

[project.scripts]
toggl-target = "toggl_target.cli.main:main"
tt = "toggl_target.cli.main:main"

[project.urls]
Homepage = "https://github.com/mos3abof/toggl_target"
Repository = "https://github.com/mos3abof/toggl_target"
Issues = "https://github.com/mos3abof/toggl_target/issues"

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "W", "I", "N", "B", "C90", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/toggl_target --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py38']